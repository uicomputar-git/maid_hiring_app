{% extends "base.html" %}{% block content %}<h1 class="h2">Update profile</h1><form method="post" enctype="multipart/form-data" class="form-panel row g-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="col-md-6"><label class="form-label">City</label><input class="form-control" name="city" required value="{{ p.city }}"></div><div class="col-md-6"><label class="form-label">State</label><input class="form-control" name="state" required value="{{ p.state }}"></div>
<div class="col-md-6"><label class="form-label">Expected monthly salary</label><input class="form-control" type="number" min="0" name="expected_salary" value="{{ p.expected_salary }}" required></div><div class="col-md-6"><label class="form-label">Languages</label><input class="form-control" name="languages" value="{{ p.languages }}"></div>
<div class="col-md-6"><label class="form-label">Profile photo</label><input class="form-control" type="file" name="photo" accept=".jpg,.jpeg,.png,.webp"></div><div class="col-md-6"><label class="form-label">Availability</label><select class="form-select" name="is_available"><option value="yes" {% if p.is_available %}selected{% endif %}>Available</option><option value="no" {% if not p.is_available %}selected{% endif %}>Not available</option></select></div><div class="col-12"><button class="btn btn-primary">Save changes</button></div></form>{% endblock %}
