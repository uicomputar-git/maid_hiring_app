{% extends "base.html" %}{% block content %}<h1 class="h2">Review {{ req.maid.full_name }}</h1><form method="post" class="form-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Rating</label><select class="form-select mb-3" name="rating" required><option value="">Choose rating</option>{% for n in range(1,6) %}<option value="{{ n }}">{{ n }} star{{ 's' if n>1 else '' }}</option>{% endfor %}</select><label class="form-label">Review</label><textarea class="form-control mb-3" name="comment" rows="4"></textarea><button class="btn btn-primary">Submit review</button></form>{% endblock %}
